name: Deploy TechByte

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-techbyte
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, gd, bcmath, intl, zip

      - name: Install PHP dependencies
        working-directory: backend-clear-laravel
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        working-directory: backend-clear-laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Laravel checks
        working-directory: backend-clear-laravel
        run: |
          php -l artisan
          php artisan config:clear
          php artisan route:list > /dev/null

      - name: Validate compose file
        # Compose requires secrets through the `${VARIABLE:?...}` syntax. CI does not
        # have them and should not - we substitute placeholder values because we are
        # checking the file SYNTAX, not the validity of the passwords.
        env:
          DB_ROOT_PASSWORD: ci
          DB_PASSWORD: ci
        run: docker compose -f .tools/docker/docker-compose.prod.yml config > /dev/null

  sekrety:
    name: Deployment configuration
    runs-on: ubuntu-latest
    outputs:
      gotowe: ${{ steps.test.outputs.gotowe }}
    steps:
      - id: test
        env:
          IP: ${{ secrets.SERVER_IP }}
          UZYTKOWNIK: ${{ secrets.SERVER_USER }}
          KLUCZ: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Missing secrets are not a build error, they just mean there is nowhere to
          # deploy. The run then finishes green and the `deploy` job is skipped, so a red
          # status means a real code problem rather than an unconfigured repository.
          brak=""
          [ -z "$IP" ]         && brak="$brak SERVER_IP"
          [ -z "$UZYTKOWNIK" ] && brak="$brak SERVER_USER"
          [ -z "$KLUCZ" ]      && brak="$brak SSH_PRIVATE_KEY"

          if [ -n "$brak" ]; then
            echo "gotowe=nie" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment skipped::Missing secrets:$brak - add them in Settings > Secrets and variables > Actions."
            echo "Deployment skipped. Missing secrets:$brak"
          else
            echo "gotowe=tak" >> "$GITHUB_OUTPUT"
            echo "Secrets present, deploying."
          fi

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [verify, sekrety]
    if: needs.sekrety.outputs.gotowe == 'tak'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            set -e
            cd /var/www/techbyte

            echo "==> Fetching changes..."
            git fetch origin main
            git reset --hard origin/main

            # `.env` is not versioned (it holds secrets), so we check for it explicitly
            # instead of letting docker compose fail on interpolation.
            if [ ! -f .tools/docker/.env ]; then
              echo "ERROR: missing .tools/docker/.env - copy .env.example and fill it in."
              exit 1
            fi

            echo "==> Rebuilding containers..."
            docker compose -f .tools/docker/docker-compose.prod.yml up -d --build

            echo "==> Waiting for the application..."
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8110/ || echo "000")
              case "$code" in 200|301|302) break;; esac
              sleep 10
            done

            echo "==> Status:"
            docker compose -f .tools/docker/docker-compose.prod.yml ps

            echo "==> Verifying the response..."
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8110/ || echo "000")
            echo "HTTP: $code"
            case "$code" in
              200|301|302) echo "==> Deploy zakonczony." ;;
              *)
                echo "The application is not responding correctly."
                docker compose -f .tools/docker/docker-compose.prod.yml logs --tail=60
                exit 1
                ;;
            esac
