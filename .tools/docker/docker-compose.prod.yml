# TechByte - production stack (techbyte.dawidolko.pl).
#
# Differs from `docker-compose.yml` in three ways:
#
#  1. Ports are exposed only on loopback and the Docker bridge. Internet traffic
#     comes in through the MP-Industries nginx, which holds ports 80/443 and the
#     certificates.
#  2. The database has reduced memory usage. The server has 3.7 GB of RAM for
#     all applications, and MySQL with default settings uses ~450 MB on its own.
#  3. Startup goes through `entrypoint.prod.sh` - without `migrate:fresh`, which
#     in the development version wipes the database on every restart.
name: techbyte-project

services:
  mysql:
    image: mysql:8.0
    container_name: techbyte-mysql
    restart: unless-stopped
    command: >-
      --innodb-buffer-pool-size=64M
      --performance-schema=OFF
      --max-connections=50
      --innodb-log-buffer-size=8M
      --key-buffer-size=8M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .tools/docker/.env}
      MYSQL_DATABASE: ${DB_DATABASE:-techbyte}
      MYSQL_USER: ${DB_USERNAME:-techbyte}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .tools/docker/.env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - techbyte-network

  app:
    build:
      context: ../../
      dockerfile: .tools/docker/Dockerfile
    container_name: techbyte-app
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["bash", "/usr/local/bin/entrypoint-prod.sh"]
    command: ["php-fpm"]
    volumes:
      - ../../backend-clear-laravel:/var/www
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./entrypoint.prod.sh:/usr/local/bin/entrypoint-prod.sh:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://techbyte.dawidolko.pl
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-techbyte}
      DB_USERNAME: ${DB_USERNAME:-techbyte}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .tools/docker/.env}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - techbyte-network

  nginx:
    image: nginx:1.27-alpine
    container_name: techbyte-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8110:80"
      - "172.17.0.1:8110:80"
    volumes:
      - ../../backend-clear-laravel:/var/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - techbyte-network

networks:
  techbyte-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
